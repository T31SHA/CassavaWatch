<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5c2a">
  <title>CassavaWatch</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="capture">
  <header class="bar">
    <span class="brand">🌿 CassavaWatch</span>
    <span id="net" class="pill" role="status" aria-live="polite"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="sw">SW</button>
    </div>
  </header>

  <ol class="steps" aria-label="Progress">
    <li data-step="1"><b>1</b><span data-i18n="step1"></span></li>
    <li data-step="2"><b>2</b><span data-i18n="step2"></span></li>
    <li data-step="3"><b>3</b><span data-i18n="step3"></span></li>
  </ol>

  <main>
    <div id="msg" class="msg" role="alert" hidden></div>

    <!-- step 1: photograph -->
    <section id="s1">
      <h1 class="instr" data-i18n="instr"></h1>
      <p class="sub" data-i18n="instr2"></p>
      <label class="bigbtn" for="photo"><span data-i18n="take"></span></label>
      <input id="photo" type="file" accept="image/*" capture="environment" multiple>
      <p class="counter"><b id="count">0</b> / 6 <span data-i18n="leaves"></span>
        <span id="count-hint" class="hint"></span></p>
      <div id="thumbs"></div>

      <div id="locbox">
        <p id="locstatus"></p>
        <label id="district-wrap" hidden>
          <span data-i18n="pick_label"></span>
          <select id="district">
            <option value="" data-i18n="pick"></option>
            <option value="0.460,34.111">Busia (KE)</option>
            <option value="0.565,34.560">Bungoma (KE)</option>
            <option value="0.520,34.300">Butula (KE)</option>
            <option value="-2.516,32.900">Mwanza (TZ)</option>
            <option value="-2.700,33.000">Misungwi (TZ)</option>
            <option value="-3.370,32.840">Kwimba (TZ)</option>
            <option value="0.347,32.583">Kampala (UG)</option>
          </select>
        </label>
      </div>

      <button id="submit" type="button" class="primary" disabled data-i18n="submit"></button>
    </section>

    <!-- step 2: diagnosing -->
    <section id="s2" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p class="center big" data-i18n="sending"></p>
      <p class="center sub" data-i18n="sending2"></p>
    </section>

    <!-- step 3: result -->
    <section id="s3" hidden>
      <article id="card" class="card">
        <p id="r-badge" class="badge"></p>
        <h2 id="r-name"></h2>
        <p id="r-name2" class="name2"></p>
        <p id="r-summary" class="summary"></p>
        <div id="r-uncertain" class="todo" hidden></div>
        <div id="r-single" class="todo soft" hidden data-i18n="single"></div>
        <h3 data-i18n="what_to_do"></h3>
        <ul id="r-bullets"></ul>
        <p id="r-conf" class="sub"></p>
        <details><summary data-i18n="details"></summary><table id="r-probs"></table></details>
      </article>
      <button id="again" type="button" class="primary" data-i18n="again"></button>
    </section>

    <p class="foot"><a href="/dashboard" data-i18n="officer"></a></p>
  </main>
</body>
</html>
